name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  BUN_VERSION: 1.4.2

jobs:
  test:
    name: Tests (core, API, web)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mms
          POSTGRES_PASSWORD: mms
          POSTGRES_DB: mms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://mms:mms@localhost:5432/mms_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Vitest (web components) and Stryker (mutation testing) run on Node by design.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Mutation testing (gate 80%)
        run: bun run test:mutation
      - run: bun run --filter @mms/web build
      - run: bun run --filter @mms/api build

  e2e:
    name: End-to-end (Playwright, API on Bun)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mms
          POSTGRES_PASSWORD: mms
          POSTGRES_DB: mms_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://mms:mms@localhost:5432/mms_dev
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: cd apps/web && bunx playwright install --with-deps chromium
      - run: bun run db:migrate && bun run db:seed
      - run: cd apps/api && bun src/main.ts &
      - run: bunx wait-on http://localhost:3000/api/health
      - run: bun run --filter @mms/web test:e2e

  api-image:
    name: API production image (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t workforce-api .

  desktop:
    name: Desktop app (Windows installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/print-spooler
            apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
      - name: Test the silent-print module on Windows
        run: bun run --filter @mms/desktop test:rust
      - name: Build the installer
        run: bun run --filter @mms/desktop build
      - uses: actions/upload-artifact@v4
        with:
          name: workforce-windows-installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
